name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: driftwatch
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: driftwatch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U driftwatch" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://driftwatch:ci@localhost:5432/driftwatch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
