x-app: &app
  build: .
  env_file: .env
  restart: unless-stopped
  volumes:
    - ./config:/app/config:ro
    - ./anchors:/app/anchors
  depends_on:
    init:
      condition: service_completed_successfully

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: driftwatch
      POSTGRES_DB: driftwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driftwatch"]
      interval: 5s
      retries: 20

  init:
    build: .
    env_file: .env
    command: ["init-db"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  news:
    <<: *app
    command: ["news-stream"]

  edgar:
    <<: *app
    command: ["edgar-poll"]

  gdelt:
    <<: *app
    command: ["gdelt-poll"]
    profiles: ["gdelt"]

volumes:
  pgdata:
