x-app: &app
  build: .
  env_file: .env
  restart: unless-stopped
  volumes:
    - ./config:/app/config:ro
    - ./anchors:/app/anchors
  depends_on:
    init:
      condition: service_completed_successfully

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: driftwatch
      POSTGRES_DB: driftwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driftwatch"]
      interval: 5s
      retries: 20

  init:
    build: .
    env_file: .env
    command: ["init-db"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  news:
    <<: *app
    command: ["news-stream"]

  edgar:
    <<: *app
    command: ["edgar-poll"]

  insider:
    <<: *app
    command: ["insider-poll"]

  analyst:
    <<: *app
    command: ["analyst"]

  scorer:
    <<: *app
    command: ["scorer"]

  notifier:
    <<: *app
    command: ["notifier"]

  trader:
    <<: *app
    command: ["trader"]

  # Nightly compressed database dump into ./backups (keeps 14 days). Restoring:
  # see "Backups" in README.md.
  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: driftwatch
      PGDATABASE: driftwatch
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/New_York
      BACKUP_AT: "02:30"
      KEEP_DAYS: "14"
    volumes:
      - ./backups:/backups
      - ./ops/backup.sh:/backup.sh:ro
    entrypoint: ["bash", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

  # Run on demand (ops/nightly.ps1): verifies the ledger, writes today's anchor and
  # the dashboard data in docs/data. Not a long-running service.
  publisher:
    <<: *app
    command: ["publish"]
    restart: "no"
    profiles: ["tools"]
    volumes:
      - ./config:/app/config:ro
      - ./anchors:/app/anchors
      - ./docs:/app/docs
      - ./backtests:/app/backtests

  gdelt:
    <<: *app
    command: ["gdelt-poll"]
    # Disabled by default: GDELT's free API is returning empty timelines (Oct 2026).
    # Re-enable with: docker compose --profile gdelt up -d
    profiles: ["gdelt"]

volumes:
  pgdata:
