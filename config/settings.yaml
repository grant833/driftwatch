universe:
  # Tickers the bot may never buy. Put every ETF from your UBS model here
  # to avoid the taxable-to-IRA wash sale trap.
  blocklist_file: config/blocklist.txt
  min_price: 5.0                # skip stocks trading under this (penny stocks)
  exclude_otc: true

edgar:
  forms: ["8-K", "4"]
  poll_seconds: 60
  ticker_map_refresh_hours: 24

gdelt:
  # GDELT DOC API allows roughly one request per 5 seconds.
  poll_seconds: 900
  spacing_seconds: 15
  timespan: 24h
  queries:
    global_risk: '(war OR sanctions OR recession OR tariffs OR "central bank" OR inflation) sourcelang:english'
    us_markets: '("stock market" OR "Wall Street" OR "Federal Reserve" OR earnings) sourcelang:english'

insider:
  poll_seconds: 30
  batch_size: 25
  min_signal_value_usd: 25000

analyst:
  poll_seconds: 20
  max_news_age_hours: 6          # only judge fresh news (forward-looking only)
  triage_model: claude-haiku-4-5-20251001
  panel_model: claude-sonnet-5-5
  triage_batch_size: 20
  triage_max_wait_minutes: 5     # otherwise wait for a full batch (cheaper)
  max_tickers_per_item: 2
  skip_if_more_symbols_than: 4   # roundup articles mention many tickers
  personas: [fundamental, skeptic, flow]
  pacing_burst_hours: 2          # panel budget is released evenly through the day
  daily_caps:                    # hard ceilings on API calls per US/Eastern day
    triage_calls: 400
    panel_calls: 450

notifier:
  daily_summary_time: "16:45"     # US/Eastern, weekdays, after the close
  strong_signal_edge: 0.05        # notify when an AGREE prediction is >= this far from 0.5

scorer:
  poll_minutes: 30
  horizons: [1, 2, 3, 5, 10]      # trading sessions after entry

trading:
  enabled: true
  allow_live: false               # refuse any non-paper Alpaca URL unless this is true
  run_times: ["09:45", "12:30", "15:45"]   # US/Eastern decision times on trading days
  snapshot_after: "16:10"         # record end-of-day equity after this time
  limit_slippage: 0.005           # marketable limit: buy <= price*1.005, sell >= price*0.995
  max_invested: 0.95              # never use more than this share of equity (no margin)
  min_price: 5.0
  halt_drawdown: 0.15             # halt an account at a 15% drop from its peak
  halt_daily_loss: 0.03           # no new entries after a 3% down day
  risk_off_slots: 0.5             # SPY below 200-day average: use half the position slots
  default_daily_vol: 0.03         # when a stock lacks price history
  reference_daily_vol: 0.02       # a stock this volatile gets a full-size position
  trials_count: 3                 # strategies tested so far (raise when you try a variant)
  accounts:
    news:                         # A: the AI news panel
      key_env: ALPACA_API_KEY
      secret_env: ALPACA_API_SECRET
      strategy: news_drift
      max_positions: 12
      max_position_pct: 0.10
      hold_days: 5
      stop_loss: 0.08
      min_edge: 0.05              # p_up must be >= 0.55 and the panel must AGREE
      max_pre_move: 0.05          # skip if the stock already jumped >5% before the call
      max_chase: 0.03             # skip if it rose >3% more since the call
      entry_window_hours: 24
    insider:                      # B: follow insider open-market buys
      key_env: ALPACA_B_API_KEY
      secret_env: ALPACA_B_API_SECRET
      strategy: insider_follow
      max_positions: 12
      max_position_pct: 0.10
      hold_days: 20
      stop_loss: 0.10
      lookback_days: 3
      max_chase: 0.05
    baseline:                     # C: plain SPY trend-following, no AI at all
      key_env: ALPACA_C_API_KEY
      secret_env: ALPACA_C_API_SECRET
      strategy: spy_trend
      sma_days: 200
