universe:
  # Tickers the bot may never buy. Put every ETF from your UBS model here
  # to avoid the taxable-to-IRA wash sale trap.
  blocklist_file: config/blocklist.txt
  min_price: 5.0                # skip stocks trading under this (penny stocks)
  exclude_otc: true

edgar:
  forms: ["8-K", "4"]
  poll_seconds: 60
  ticker_map_refresh_hours: 24

gdelt:
  # GDELT DOC API allows roughly one request per 5 seconds.
  poll_seconds: 900
  spacing_seconds: 15
  timespan: 24h
  queries:
    global_risk: '(war OR sanctions OR recession OR tariffs OR "central bank" OR inflation) sourcelang:english'
    us_markets: '("stock market" OR "Wall Street" OR "Federal Reserve" OR earnings) sourcelang:english'

insider:
  poll_seconds: 30
  batch_size: 25
  min_signal_value_usd: 25000

analyst:
  poll_seconds: 20
  max_news_age_hours: 6          # only judge fresh news (forward-looking only)
  triage_model: claude-haiku-4-5-20251001
  panel_model: claude-sonnet-5-5
  triage_batch_size: 20
  max_tickers_per_item: 2
  skip_if_more_symbols_than: 4   # roundup articles mention many tickers
  personas: [fundamental, skeptic, flow]
  pacing_burst_hours: 2          # panel budget is released evenly through the day
  daily_caps:                    # hard ceilings on API calls per US/Eastern day
    triage_calls: 400
    panel_calls: 450

notifier:
  daily_summary_time: "16:45"     # US/Eastern, weekdays, after the close
  strong_signal_edge: 0.05        # notify when an AGREE prediction is >= this far from 0.5

scorer:
  poll_minutes: 30
  horizons: [1, 5, 10]            # trading sessions after entry
